services:
  - type: web
    name: courtmate-api
    runtime: python
    plan: free
    region: singapore
    rootDir: api
    buildCommand: uv sync --frozen
    startCommand: uv run fastapi run main.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CORS_ORIGINS
        sync: false
